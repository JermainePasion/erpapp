{% include "erpw/base.html" %}
{% load static %}
 <link rel="stylesheet" href="{% static 'contacts/contacts.css' %}">
<!doctype html>
<html lang="en">
{% block content %}
<link rel="stylesheet" type="text/css" href="{% static '../css/style.css' %}">
<link href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
<script src="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<!------ Include the above in your HEAD tag ---------->

    {% if messages %}
{% for message in messages %}
    <div class="alert alert-{{ message.tags }} mt-4" style="width: 800px;margin: auto">
    {{ message }}
    </div>
{% endfor %}
{% endif %}
</head>
<body>
<div class="container contact-form">

            <form method="post">
                {% csrf_token %}
                <h3>CONTACT SUPPORT</h3>
               <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <input type="text" name="firstname" class="form-control" {{ form.firstname }}
                        </div>
                         <div class="form-group">
                            <input type="text" name="lastname" class="form-control" {{ form.lastname }}
                        </div>
                        <div class="form-group">
                            <input type="text" name="email" class="form-control" {{ form.email }}
                        </div>
                        <div class="form-group">
                            <input type="text" name="number" class="form-control" {{ form.number }}
                        </div>
                        <div class="form-group">
                            <input type="submit" name="btnSubmit" class="btnContact" value="Send Message" required/>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <textarea name="subject" class="form-control" {{ form.subject }}</textarea/>
                        </div>
                    </div>
                </div>
            </form>
</div>
</body>
{% endblock content %}
</html>
