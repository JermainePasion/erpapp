{% include "erpw/base.html" %}
{% load static %}
 <link rel="stylesheet" href="{% static 'contacts/contacts.css' %}">
<!doctype html>
<html lang="en">
{% block content %}
<link rel="stylesheet" type="text/css" href="{% static '../css/style.css' %}">
<link href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
<script src="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<!------ Include the above in your HEAD tag ---------->
</head>
<body>
<div class="container contact-form">
            <div class="contact-image">
                <img src="{% static 'erpw/images/logo.jpg' %}" alt="rocket_contact"/>
            </div>
            <form method="post">
                {% csrf_token %}
                <h3>CONTACT SUPPORT</h3>
               <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <input type="text" name="firstname" class="form-control" placeholder="First Name *" value=""  />
                        </div>
                         <div class="form-group">
                            <input type="text" name="lastname" class="form-control" placeholder="Last Name *" value=""  />
                        </div>
                        <div class="form-group">
                            <input type="text" name="email" class="form-control" placeholder="Your Email *" value=""  />
                        </div>
                        <div class="form-group">
                            <input type="text" name="number" class="form-control" placeholder="Your Phone Number *" value="" />
                        </div>
                        <div class="form-group">
                            <input type="submit" name="btnSubmit" class="btnContact" value="Send Message" required/>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <textarea name="subject" class="form-control" placeholder="Your Message *" style="width: 100%; height: 200px;"></textarea/>
                        </div>
                    </div>
                </div>
            </form>
</div>
</body>
{% endblock content %}
</html>
