{% include "erpw/base.html" %}
{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'erpw/users.css' %}">
{% block content %}
    <link href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
<script src="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

<link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN"
        crossorigin="anonymous">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
        crossorigin="anonymous"></script>

    <head>
<div class="container">
            <a href="{% url 'erpw-create' %}">
                <button class="btn btn-primary btn-lg" style="padding: 8.5px 35px;"><i class="bx bx-pencil"></i> Create Post</button>
            </a>
    </head>
    {% for post in posts%}


    </div>
<div class="card gedf-card" style="margin-left: 205px; margin-right: 115px; margin-top: 20px">
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="mr-2">
                                    <img class="rounded-circle" width="45" src="{{ post.author.profile.image.url }}" alt="">
                                </div>
                                <div class="ml-2">
                                    <div class="h5 m-0">{{ post.author }}</div>
                                </div>
                            </div>

                        </div>

                    </div>
                    <div class="card-body">
                        <div class="text-muted h7 mb-2"> <i class="fa fa-clock-o"></i>{{ post.date_posted }}</div>
                        <a class="card-link" href="{% url 'erpw-detail' post.id %}">
                            <h5 class="card-title"> {{ post.title }}</h5>
                        </a>

                        <p class="card-text">
                            {{ post.content }}
                        </p>
                    </div>
                    <div class="card-footer">
                    </div>
                </div>
    {% endfor %}
{% endblock content %}
