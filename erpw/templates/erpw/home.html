{% include "erpw/base.html" %}
{% load static %}
{% block content %}

    <div class="content-section">
        <div class="d-flex justify-content-right">

            <div class="card m-4" styles="width: 5%">
                <div class="card-body">
                    <div id="chart1"></div>
                </div>
            </div>

             <div class="card m-4" styles="width: 55%">
                <div class="card-body">
                    <div id="chart2"></div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script type="text/javascript">
        var graph1 = {{ sales_graph| safe }}
        Plotly.plot("chart1", graph1, {})

        var graph2 = {{ best_performing_product| safe }}
        Plotly.plot("chart2", graph2, {})
    </script>
{% endblock content %}
