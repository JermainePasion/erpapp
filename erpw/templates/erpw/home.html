{% include "erpw/base.html" %}
{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'erpw/home.css' %}">
{% block content %}
    <div class="content-section">
        <div class="d-flex">

                <div class="wrapper">
                    <div class="box">
                        <a href="{% url 'erpw-users' %}">
                            <img src="{% static 'erpw/images/chat_icon.png' %}">
                        </a>
                        <h2></h2>
                        <p style="font-size: 35px;">Users Page</p>
                    </div>
                    <div class="box">
                        <a href="{% url 'orders:show' %}">
                            <img src="{% static 'erpw/images/cart_icon.png' %}">
                        </a>
                        <h2></h2>
                        <p style="font-size: 35px;">Create Order</p>
                    </div>
                    <div class="box">
                        <a href="{% url 'contacts' %}">
                            <img src="{% static 'erpw/images/contact_icon.svg' %}">
                        </a>
                        <h2></h2>
                        <p style="font-size: 35px;">Contact Support</p>
                    </div>
                    {% if user.is_superuser %}
                        <div class="card m-4">
                            <div class="card-body">
                                <div id="chart1"></div>
                            </div>

                        <div class="card-body">
                                <div id="chart3"></div>
                            </div>
                        </div>

                        <div class="card m-4">
                            <div class="card-body">
                                <div id="chart2"></div>
                            </div>
                        </div>
                    {% endif %}


        </div>
    </div>

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script type="text/javascript">
        var graph1 = {{ sales_graph| safe }}
        Plotly.plot("chart1", graph1, {})

        var graph2 = {{ best_performing_product| safe }}
        Plotly.plot("chart2", graph2, {})

        var graph3 = {{ most_product_in_stock| safe }}
        Plotly.plot("chart3", graph3, {})
    </script>
{% endblock content %}
