{% include "erpw/base.html" %}
{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'inventory/inventory_add.css' %}">
{% block content %}
<head>
    <title>Registration Form</title>
	  <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Registration Form</h1>
    <p>Please fill out this form with the required information</p>
    <form method="POST">
      <fieldset>
          {% csrf_token %}
        <div class="form-group pt-4">
            {{ form|crispy }}
        </div>
          <div class="form-group pt-4">
              <button class="btn btn-outline-success" type="submit">Add Inventory</button>
          </div>
      </fieldset>

      <input type="submit" value="Submit" />
    </form>
  </body>
{% endblock content %}
